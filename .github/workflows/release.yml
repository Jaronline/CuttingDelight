name: Release Mod
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish-type:
        description: 'Type of release to publish'
        required: true
        default: 'STABLE'
        type: choice
        options:
          - STABLE
          - BETA
          - ALPHA
      publish-maven:
        description: 'Whether to publish the artifacts to a Maven repository'
        required: true
        default: true
        type: boolean
      publish-curseforge:
        description: 'Whether to publish the mod to CurseForge'
        required: true
        default: true
        type: boolean
      publish-modrinth:
        description: 'Whether to publish the mod to Modrinth'
        required: true
        default: true
        type: boolean
      publish-common:
        description: 'Whether to publish the Common module to Maven'
        required: true
        default: true
        type: boolean
      publish-neoforge:
        description: 'Whether to publish the NeoForge module to Maven'
        required: true
        default: true
        type: boolean

env:
  MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
  CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
  JAVA_DISTRIBUTION: microsoft
  JAVA_VERSION: '21'
  JAVA_CACHE: gradle

jobs:
  build-common:
    name: Build Common
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: ${{ env.JAVA_CACHE }}
      - name: Build :Common
        run: ./gradlew :Common:build
      - name: Upload :Common artifact
        uses: actions/upload-artifact@v7
        with:
          name: common-artifact
          path: Common/build

  build-neoforge:
    name: Build NeoForge
    runs-on: ubuntu-latest
    needs:
      - build-common
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: ${{ env.JAVA_CACHE }}
      - name: Download :Common artifact
        uses: actions/download-artifact@v8
        with:
          name: common-artifact
          path: Common/build
      - name: Build :NeoForge
        run: ./gradlew :NeoForge:build
      - name: Upload :NeoForge artifact
        uses: actions/upload-artifact@v7
        with:
          name: neoforge-artifact
          path: NeoForge/build

  publish-common:
    name: Publish Common
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || (github.event.inputs.publish-maven == 'true' && github.event.inputs.publish-common == 'true')
    needs: build-common
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: ${{ env.JAVA_CACHE }}
      - name: Download :Common artifact
        uses: actions/download-artifact@v8
        with:
          name: common-artifact
          path: Common/build
      - name: Publish :Common
        run: ./gradlew :Common:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-neoforge:
    name: Publish NeoForge
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || (github.event.inputs.publish-maven == 'true' && github.event.inputs.publish-forge == 'true')
    needs: build-neoforge
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: ${{ env.JAVA_CACHE }}
      - name: Download :NeoForge artifact
        uses: actions/download-artifact@v8
        with:
          name: neoforge-artifact
          path: NeoForge/build
      - name: Publish :NeoForge
        run: ./gradlew :NeoForge:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  determine-publish-type:
    name: Determine publish type
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || (github.event.inputs.publish-curseforge == 'true' || github.event.inputs.publish-modrinth == 'true')
    outputs:
      publish-type: ${{ steps.set_publish_type.outputs.publish_type }}
    steps:
      - name: Set publish type
        id: set_publish_type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "publish_type=${{ github.event.inputs.publish-type }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.release.prerelease }}" = "true" ]; then
            echo "publish_type=BETA" >> $GITHUB_OUTPUT
          else
            echo "publish_type=STABLE" >> $GITHUB_OUTPUT
          fi
      - run: echo "Publish type is ${{ steps.set_publish_type.outputs.publish_type }}"

  publish-curseforge:
    name: Publish CurseForge
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event.inputs.publish-curseforge == 'true'
    needs:
      - build-neoforge
      - determine-publish-type
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: ${{ env.JAVA_CACHE }}
      - name: Download :NeoForge artifact
        uses: actions/download-artifact@v8
        with:
          name: neoforge-artifact
          path: NeoForge/build
      - name: Publish CurseForge
        run: ./gradlew :NeoForge:publishCurseforge
        env:
          PUBLISH_TYPE: ${{ needs.determine-publish-type.outputs.publish-type }}

  publish-modrinth:
    name: Publish Modrinth
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event.inputs.publish-modrinth == 'true'
    needs:
      - build-neoforge
      - determine-publish-type
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: ${{ env.JAVA_CACHE }}
      - name: Download :NeoForge artifact
        uses: actions/download-artifact@v8
        with:
          name: neoforge-artifact
      - name: Publish Modrinth
        run: ./gradlew :NeoForge:publishModrinth
        env:
          PUBLISH_TYPE: ${{ needs.determine-publish-type.outputs.publish-type }}
