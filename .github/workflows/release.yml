name: Release Mod
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish-type:
        description: 'Type of release to publish'
        required: true
        default: 'STABLE'
        type: choice
        options:
          - STABLE
          - BETA
          - ALPHA
      publish-maven:
        description: 'Whether to publish the artifacts to a Maven repository'
        required: true
        default: true
        type: boolean
      publish-curseforge:
        description: 'Whether to publish the mod to CurseForge'
        required: true
        default: true
        type: boolean
      publish-modrinth:
        description: 'Whether to publish the mod to Modrinth'
        required: true
        default: true
        type: boolean
      publish-core:
        description: 'Whether to publish the Core module to Maven'
        required: true
        default: true
        type: boolean
      publish-common:
        description: 'Whether to publish the Common module to Maven'
        required: true
        default: true
        type: boolean
      publish-forge:
        description: 'Whether to publish the Forge module to Maven'
        required: true
        default: true
        type: boolean

env:
  ORG_GRADLE_PROJECT_modrinthToken: ${{ secrets.MODRINTH_TOKEN }}
  ORG_GRADLE_PROJECT_curseforgeApikey: ${{ secrets.CURSEFORGE_API_KEY }}

permissions:
  contents: read

jobs:
  build-core:
    name: Build Core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '17'
          cache: gradle
      - name: Build :Core
        run: ./gradlew :Core:build
      - name: Upload :Core artifact
        uses: actions/upload-artifact@v6
        with:
          name: core-artifact
          path: Core/build

  build-common:
    name: Build Common
    runs-on: ubuntu-latest
    needs: build-core
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '17'
          cache: gradle
      - name: Download :Core artifact
        uses: actions/download-artifact@v7
        with:
          name: core-artifact
          path: Core/build
      - name: Build :Common
        run: ./gradlew :Common:build
      - name: Upload :Common artifact
        uses: actions/upload-artifact@v6
        with:
          name: common-artifact
          path: Common/build

  build-forge:
    name: Build Forge
    runs-on: ubuntu-latest
    needs:
      - build-core
      - build-common
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
            distribution: microsoft
            java-version: '17'
            cache: gradle
      - name: Download :Core artifact
        uses: actions/download-artifact@v7
        with:
          name: core-artifact
          path: Core/build
      - name: Download :Common artifact
        uses: actions/download-artifact@v7
        with:
          name: common-artifact
          path: Common/build
      - name: Build :Forge
        run: ./gradlew :Forge:build
      - name: Upload :Forge artifact
        uses: actions/upload-artifact@v6
        with:
          name: forge-artifact
          path: Forge/build

  publish-core:
    name: Publish Core
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || (github.event.inputs.publish-maven == 'true' && github.event.inputs.publish-core == 'true')
    needs: build-core
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '17'
          cache: gradle
      - name: Download :Core artifact
        uses: actions/download-artifact@v7
        with:
          name: core-artifact
          path: Core/build
      - name: Publish :Core
        run: ./gradlew :Core:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-common:
    name: Publish Common
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || (github.event.inputs.publish-maven == 'true' && github.event.inputs.publish-common == 'true')
    needs: build-common
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '17'
          cache: gradle
      - name: Download :Common artifact
        uses: actions/download-artifact@v7
        with:
          name: common-artifact
          path: Common/build
      - name: Publish :Common
        run: ./gradlew :Common:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-forge:
    name: Publish Forge
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || (github.event.inputs.publish-maven == 'true' && github.event.inputs.publish-forge == 'true')
    needs: build-forge
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '17'
          cache: gradle
      - name: Download :Forge artifact
        uses: actions/download-artifact@v7
        with:
          name: forge-artifact
          path: Forge/build
      - name: Publish :Forge
        run: ./gradlew :Forge:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  determine-publish-type:
    name: Determine publish type
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || (github.event.inputs.publish-curseforge == 'true' || github.event.inputs.publish-modrinth == 'true')
    outputs:
      publish-type: ${{ steps.set_publish_type.outputs.publish_type }}
    steps:
      - name: Set publish type
        id: set_publish_type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "publish_type=${{ github.event.inputs.publish-type }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.release.prerelease }}" = "true" ]; then
            echo "publish_type=BETA" >> $GITHUB_OUTPUT
          else
            echo "publish_type=STABLE" >> $GITHUB_OUTPUT
          fi
      - run: echo "Publish type is ${{ steps.set_publish_type.outputs.publish_type }}"

  publish-curseforge:
    name: Publish CurseForge
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event.inputs.publish-curseforge == 'true'
    needs:
      - build-forge
      - determine-publish-type
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '17'
          cache: gradle
      - name: Download :Forge artifact
        uses: actions/download-artifact@v7
        with:
          name: forge-artifact
          path: Forge/build
      - name: Publish CurseForge
        run: ./gradlew :Forge:publishCurseforge
        env:
          PUBLISH_TYPE: ${{ needs.determine-publish-type.outputs.publish-type }}

  publish-modrinth:
    name: Publish Modrinth
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event.inputs.publish-modrinth == 'true'
    needs:
      - build-forge
      - determine-publish-type
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '17'
          cache: gradle
      - name: Download :Forge artifact
        uses: actions/download-artifact@v7
        with:
          name: forge-artifact
      - name: Publish Modrinth
        run: ./gradlew :Forge:publishModrinth
        env:
          PUBLISH_TYPE: ${{ needs.determine-publish-type.outputs.publish-type }}
