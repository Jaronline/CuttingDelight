name: Release Mod
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish-type:
        description: 'Type of release to publish'
        required: true
        default: 'STABLE'
        type: choice
        options:
          - STABLE
          - BETA
          - ALPHA

permissions:
  contents: read

env:
  MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
  CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
  JAVA_DISTRIBUTION: microsoft
  JAVA_VERSION: '25'
  JAVA_CACHE: gradle

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: ${{ env.JAVA_CACHE }}
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build
      - name: Prepare Artifacts
        run: |
          for d in Common NeoForge Fabric; do
            mkdir -p "dist/$d"
            cp -r "$d/build" "dist/$d/build"
          done
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: subprojects-build
          path: dist
          retention-days: ${{ vars.RELEASE_ARTIFACT_RETENTION || 30 }}

  define-maven-matrix:
    runs-on: ubuntu-latest
    outputs:
      subprojects: ${{ steps.subprojects.outputs.subprojects }}
    steps:
      - name: Define Subprojects
        id: subprojects
        run: |
          subprojects=()
          for p in Common NeoForge Fabric; do
            upper_p=$(echo "$p" | tr '[:lower:]' '[:upper:]')
            var_name="PUBLISH_${upper_p}"
          
            if [ "${!var_name}" = "true" ]; then
              subprojects+=("$p")
            fi
          done
          echo "subprojects=$(jq --compact-output --null-input '$ARGS.positional' --args -- "${subprojects[@]}")" >> "$GITHUB_OUTPUT"
    env:
      PUBLISH_COMMON: ${{ vars.RELEASE_PUBLISH_MAVEN_COMMON }}
      PUBLISH_NEOFORGE: ${{ vars.RELEASE_PUBLISH_MAVEN_NEOFORGE }}
      PUBLISH_FABRIC: ${{ vars.RELEASE_PUBLISH_MAVEN_FABRIC }}

  publish-maven:
    name: Publish Maven
    runs-on: ubuntu-latest
    needs:
      - build
      - define-maven-matrix
    if: needs.define-maven-matrix.outputs.subprojects != '[]'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        subproject: ${{ fromJSON(needs.define-maven-matrix.outputs.subprojects) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: ${{ env.JAVA_CACHE }}
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: subprojects-build
          path: dist
      - name: Prepare subproject
        run: |
          mv dist/${{ matrix.subproject }}/build ${{ matrix.subproject }}
          rm -rf dist
      - name: Publish :${{ matrix.subproject }}
        run: ./gradlew :${{ matrix.subproject }}:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  determine-publish-type:
    name: Determine publish type
    runs-on: ubuntu-latest
    outputs:
      publish-type: ${{ steps.set_publish_type.outputs.publish_type }}
    steps:
      - name: Set publish type
        id: set_publish_type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "publish_type=${{ github.event.inputs.publish-type }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.release.prerelease }}" = "true" ]; then
            echo "publish_type=BETA" >> $GITHUB_OUTPUT
          else
            echo "publish_type=STABLE" >> $GITHUB_OUTPUT
          fi
      - run: echo "Publish type is ${{ steps.set_publish_type.outputs.publish_type }}"

  define-curseforge-matrix:
    runs-on: ubuntu-latest
    outputs:
      subprojects: ${{ steps.subprojects.outputs.subprojects }}
    steps:
      - name: Define Subprojects
        id: subprojects
        run: |
          subprojects=()
          for p in NeoForge Fabric; do
            upper_p=$(echo "$p" | tr '[:lower:]' '[:upper:]')
            var_name="PUBLISH_${upper_p}"
          
            if [ "${!var_name}" = "true" ]; then
              subprojects+=("$p")
            fi
          done
          echo "subprojects=$(jq --compact-output --null-input '$ARGS.positional' --args -- "${subprojects[@]}")" >> "$GITHUB_OUTPUT"
        env:
          PUBLISH_NEOFORGE: ${{ vars.RELEASE_PUBLISH_CURSEFORGE_NEOFORGE }}
          PUBLISH_FABRIC: ${{ vars.RELEASE_PUBLISH_CURSEFORGE_FABRIC }}

  publish-curseforge:
    name: Publish CurseForge
    runs-on: ubuntu-latest
    needs:
      - build
      - determine-publish-type
      - define-curseforge-matrix
    if: needs.define-curseforge-matrix.outputs.subprojects != '[]'
    strategy:
      fail-fast: false
      matrix:
        subproject: ${{ fromJSON(needs.define-curseforge-matrix.outputs.subprojects) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: ${{ env.JAVA_CACHE }}
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: subprojects-build
          path: dist
      - name: Prepare subproject
        run: |
          mv dist/${{ matrix.subproject }}/build ${{ matrix.subproject }}
          rm -rf dist
      - name: Publish CurseForge
        run: ./gradlew :${{ matrix.subproject }}:publishCurseforge
        env:
          PUBLISH_TYPE: ${{ needs.determine-publish-type.outputs.publish-type }}

  define-modrinth-matrix:
    runs-on: ubuntu-latest
    outputs:
      subprojects: ${{ steps.subprojects.outputs.subprojects }}
    steps:
      - name: Define Subprojects
        id: subprojects
        run: |
          subprojects=()
          for p in NeoForge Fabric; do
            upper_p=$(echo "$p" | tr '[:lower:]' '[:upper:]')
            var_name="PUBLISH_${upper_p}"
          
            if [ "${!var_name}" = "true" ]; then
              subprojects+=("$p")
            fi
          done
          echo "subprojects=$(jq --compact-output --null-input '$ARGS.positional' --args -- "${subprojects[@]}")" >> "$GITHUB_OUTPUT"
        env:
          PUBLISH_NEOFORGE: ${{ vars.RELEASE_PUBLISH_MODRINTH_NEOFORGE }}
          PUBLISH_FABRIC: ${{ vars.RELEASE_PUBLISH_MODRINTH_FABRIC }}

  publish-modrinth:
    name: Publish Modrinth
    runs-on: ubuntu-latest
    needs:
      - build
      - determine-publish-type
      - define-modrinth-matrix
    if: needs.define-modrinth-matrix.outputs.subprojects != '[]'
    strategy:
      fail-fast: false
      matrix:
        subproject: ${{ fromJSON(needs.define-modrinth-matrix.outputs.subprojects) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: ${{ env.JAVA_CACHE }}
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: subprojects-build
          path: dist
      - name: Prepare subproject
        run: |
          mv dist/${{ matrix.subproject }}/build ${{ matrix.subproject }}
          rm -rf dist
      - name: Publish Modrinth
        run: ./gradlew :${{ matrix.subproject }}:publishModrinth
        env:
          PUBLISH_TYPE: ${{ needs.determine-publish-type.outputs.publish-type }}
