[versions]
# Cutting Delight
cuttingdelight = "1.1.1"

# Common
minecraft = { strictly = "[1.21.1]", prefer = "1.21.1" }
loom-mc = "1.21.1"
# https://projects.neoforged.net/neoforged/neoform
neoform = "1.21.1-20240808.144430"
java = "21"

# Fabric
fabric = "0.20.0"
fabric-range = ">=0.19.5"
fabric-api = "0.116.17+1.21.1"
fabric-api-range = ">=0.116.17+1.21.1"

# NeoForge
neoforge-loader = { strictly = "[1,)", prefer = "5" }
neoforge = { strictly = "[21.1.219,)", prefer = "21.1.250" }

# Parchment
parchment-minecraft = "1.21.1"
parchment-mappings = "2024.11.17"

# Dependencies
mixin = "0.8.7"
jspecify = "1.0.1"

# Mods
## Farmer's Delight
farmersdelight = { strictly = "[1.3.0,)", prefer = "1.3.2" }
farmersdelight-fabric = { strictly = ">=1.21.1-3.3.0", prefer = "1.21.1-3.3.6" }
farmersdelight-mc = "1.21.1-1.3.2"
farmersdelight-fabric-mc = "1.21.1-3.3.6+refabricated"
## Mezz
jei = "19.57.0.451"
mezz-config = "0.6.8"
mezz-config-range = ">=0.5.0 <1.0.0"
mezz-config-gui = "mc1.21.1-0.5.5"
mezz-config-gui-min = "0.5.5"
## Other
modmenu = "11.0.5"

# Testing
junit = "5.14.4"

# Plugins
plugin-tasktree = "4.0.2"
plugin-spotless = "8.10.3"
plugin-gitchangelog = "3.4.2"
plugin-modpublish = "2.2.1"
plugin-moddevgradle = "2.0.148"
plugin-loom = "1.18.2"

[libraries]
# Common
mixin = { group = "org.spongepowered", name = "mixin", version.ref = "mixin" }
jspecify = { group = "org.jspecify", name = "jspecify", version.ref = "jspecify" }

# Fabric
fabric = { group = "net.fabricmc", name = "fabric-loader", version.ref = "fabric" }
fabric-api = { group = "net.fabricmc.fabric-api", name = "fabric-api", version.ref = "fabric-api" }
loom-minecraft = { group = "com.mojang", name = "minecraft", version.ref = "loom-mc" }

# Dependencies
## Farmer's Delight
farmersdelight = { group = "maven.modrinth", name = "farmers-delight", version.ref = "farmersdelight-mc" }
farmersdelight-fabric = { group = "vectorwing", name = "FarmersDelight", version.ref = "farmersdelight-fabric-mc" }
## JEI
jei-common-api = { group = "mezz.jei", name = "jei-1.21.1-common-api", version.ref = "jei" }
jei-neoforge = { group = "mezz.jei", name = "jei-1.21.1-neoforge", version.ref = "jei" }
jei-fabric = { group = "mezz.jei", name = "jei-1.21.1-fabric", version.ref = "jei" }
mezz-config-api = { group = "net.mezzdev.config", name = "mezz_config-1.21.1-config-api", version.ref = "mezz-config" }
mezz-config-fabric = { group = "net.mezzdev.config", name = "mezz_config-1.21.1-fabric", version.ref = "mezz-config" }
mezz-config-gui-fabric = { group = "net.mezzdev.config", name = "mezz_config_gui-1.21.1-fabric", version.ref = "mezz-config-gui" }
## Other
modmenu = { group = "com.terraformersmc", name = "modmenu", version.ref = "modmenu" }

# Testing
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }

[plugins]
# https://plugins.gradle.org/plugin/com.dorongold.task-tree
tasktree = { id = "com.dorongold.task-tree", version.ref = "plugin-tasktree" }
# https://plugins.gradle.org/plugin/com.diffplug.gradle.spotless
spotless = { id = "com.diffplug.spotless", version.ref = "plugin-spotless" }
# https://plugins.gradle.org/plugin/se.bjurr.gitchangelog.git-changelog-gradle-plugin
gitchangelog = { id = "se.bjurr.gitchangelog.git-changelog-gradle-plugin", version.ref = "plugin-gitchangelog" }

# Publishing
# https://plugins.gradle.org/plugin/me.modmuss50.mod-publish-plugin
modpublish = { id = "me.modmuss50.mod-publish-plugin", version.ref = "plugin-modpublish" }

# Platform
# https://projects.neoforged.net/neoforged/moddevgradle
moddevgradle = { id = "net.neoforged.moddev", version.ref = "plugin-moddevgradle" }
# https://maven.fabricmc.net/net/fabricmc/fabric-loom-remap/net.fabricmc.fabric-loom-remap.gradle.plugin/maven-metadata.xml
loom = { id = "net.fabricmc.fabric-loom-remap", version.ref = "plugin-loom" }
# https://maven.fabricmc.net/net/fabricmc/fabric-loom-companion/net.fabricmc.fabric-loom-companion.gradle.plugin/maven-metadata.xml
loom-companion = { id = "net.fabricmc.fabric-loom-companion", version.ref = "plugin-loom" }