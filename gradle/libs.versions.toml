[versions]
# Cutting Delight
cuttingdelight = "1.1.0"

# Common
minecraft = { strictly = "[1.20.1, 1.20.2)", prefer = "1.20.1" }
java = "17"

# Forge
forge-fml = { strictly = "[47,)", prefer = "47" }
forge = { strictly = "[47.0,)", prefer = "47.4.20" }
forge-mc = "1.20.1-47.4.20"

# Parchment
parchment-minecraft = "1.20.1"
parchment-mappings = "2023.09.03"

# Dependencies
mixin = "0.8.7"
guava = "32.1.3-jre"
jetbrains-annotations = "26.1.0"

# Mods
farmersdelight = { strictly = "[1.3.0,)", prefer = "1.3.2" }
farmersdelight-mc = "1.20.1-1.3.2"
jei = "15.59.0.210"

# Testing
junit = "5.14.4"

# Plugins
plugin-tasktree = "4.0.2"
plugin-spotless = "8.10.2"
plugin-gitchangelog = "3.1.2"
plugin-modpublish = "2.2.0"
plugin-vanillagradle = "0.3.2"
plugin-mixin = "0.7.38"
plugin-forgegradle = "6.0.54"
plugin-librarian-forgegradle = "1.2.0"

[libraries]
# Common
mixin = { group = "org.spongepowered", name = "mixin", version.ref = "mixin" }
guava = { group = "com.google.guava", name = "guava", version.ref = "guava" }
jetbrains-annotations = { group = "org.jetbrains", name = "annotations", version.ref = "jetbrains-annotations" }

# Forge
forge = { group = "net.minecraftforge", name = "forge", version.ref = "forge-mc" }

# Dependencies
farmersdelight = { group = "maven.modrinth", name = "farmers-delight", version.ref = "farmersdelight-mc" }
## JEI
jei-common-api = { group = "mezz.jei", name = "jei-1.20.1-common-api", version.ref = "jei" }
jei-forge = { group = "mezz.jei", name = "jei-1.20.1-forge", version.ref = "jei" }

# Testing
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }

[plugins]
# https://plugins.gradle.org/plugin/com.dorongold.task-tree
tasktree = { id = "com.dorongold.task-tree", version.ref = "plugin-tasktree" }
# https://plugins.gradle.org/plugin/com.diffplug.gradle.spotless
spotless = { id = "com.diffplug.spotless", version.ref = "plugin-spotless" }
# https://plugins.gradle.org/plugin/se.bjurr.gitchangelog.git-changelog-gradle-plugin
gitchangelog = { id = "se.bjurr.gitchangelog.git-changelog-gradle-plugin", version.ref = "plugin-gitchangelog" }

# Publishing
# https://plugins.gradle.org/plugin/me.modmuss50.mod-publish-plugin
modpublish = { id = "me.modmuss50.mod-publish-plugin", version.ref = "plugin-modpublish" }

# Platform
# https://plugins.gradle.org/plugin/org.spongepowered.gradle.vanilla
vanillagradle = { id = "org.spongepowered.gradle.vanilla", version.ref = "plugin-vanillagradle" }
# https://repo.spongepowered.org/service/rest/repository/browse/maven-public/org/spongepowered/mixingradle/
mixin = { id = "org.spongepowered.mixin", version.ref = "plugin-mixin" }
# https://files.minecraftforge.net/net/minecraftforge/gradle/ForgeGradle/index.html
forgegradle = { id = "net.minecraftforge.gradle", version.ref = "plugin-forgegradle" }
# https://mvnrepository.com/artifact/org.parchmentmc.librarian.forgegradle/org.parchmentmc.librarian.forgegradle.gradle.plugin
librarian-forgegradle = { id = "org.parchmentmc.librarian.forgegradle", version.ref = "plugin-librarian-forgegradle" }
